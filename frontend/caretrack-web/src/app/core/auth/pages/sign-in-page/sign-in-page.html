<div class="sign-in-page grid min-h-screen place-items-center px-4 py-8">
  <main
    class="sign-in-page__card w-full max-w-md rounded-ct-lg border border-ct-border bg-ct-surface p-6 text-center sm:p-8"
  >
    <div class="sign-in-page__brand">
      <img src="/brand/caretrack-symbol.svg" alt="" />
      <h1>CareTrack</h1>
      <p class="sign-in-page__descriptor">Clinical Referral &amp; Workflow Management</p>
    </div>

    <p class="sign-in-page__supporting-copy">
      Continue with your authorised Microsoft account to access the clinical workspace.
    </p>

    <ct-button
      class="block w-full"
      [loading]="interactionInProgress()"
      [disabled]="!canSignIn()"
      (click)="signIn()"
    >
      <i class="ph ph-microsoft-logo" aria-hidden="true"></i>
      Sign in with Microsoft
    </ct-button>
  </main>
</div>
