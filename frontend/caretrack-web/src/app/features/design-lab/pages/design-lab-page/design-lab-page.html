
<div class="mb-8 flex flex-wrap gap-2">
  <button
    type="button"
    class="rounded-lg border px-4 py-2 text-sm"
    (click)="selectDirection('quiet')"
  >
    Quiet Clinical
  </button>

  <button
    type="button"
    class="rounded-lg border px-4 py-2 text-sm"
    (click)="selectDirection('editorial')"
  >
    Editorial Operations
  </button>

  <button
    type="button"
    class="rounded-lg border px-4 py-2 text-sm"
    (click)="selectDirection('structured')"
  >
    Structured Modern
  </button>
</div>

@if (activeDirection() === 'quiet') {
  <app-quiet-clinical />
}

@if (activeDirection() === 'editorial') {
  <app-editorial-operations />
}

@if (activeDirection() === 'structured') {
  <app-structured-modern />
}
