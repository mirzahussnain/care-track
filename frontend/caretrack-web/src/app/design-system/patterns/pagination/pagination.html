<nav class="ct-pagination" [attr.aria-label]="ariaLabel()">
  <p class="ct-pagination__summary" aria-live="polite">
    Showing {{ firstResult() }}–{{ lastResult() }} of {{ totalCount() }}
  </p>
  <div class="ct-pagination__controls">
    <button
      type="button"
      class="ct-pagination__button ct-pagination__button--wide"
      [disabled]="page() <= 1"
      aria-label="Go to previous page"
      (click)="goToPage(page() - 1)"
    >
      <i class="ph ph-caret-left" aria-hidden="true"></i
      ><span class="hidden sm:inline">Previous</span>
    </button>
    <div class="ct-pagination__pages" aria-label="Page selection">
      @for (item of items(); track item.key) {
        @if (item.kind === 'page') {
          <button
            type="button"
            class="ct-pagination__button ct-pagination__button--page"
            [class.ct-pagination__button--current]="item.value === page()"
            [attr.aria-current]="item.value === page() ? 'page' : null"
            [attr.aria-label]="'Go to page ' + item.value"
            [disabled]="item.value === page()"
            (click)="goToPage(item.value)"
          >
            {{ item.value }}
          </button>
        } @else {
          <span class="ct-pagination__ellipsis" aria-hidden="true">…</span>
        }
      }
    </div>
    <button
      type="button"
      class="ct-pagination__button ct-pagination__button--wide"
      [disabled]="page() >= totalPages() || totalPages() === 0"
      aria-label="Go to next page"
      (click)="goToPage(page() + 1)"
    >
      <span class="hidden sm:inline">Next</span><i class="ph ph-caret-right" aria-hidden="true"></i>
    </button>
  </div>
</nav>
