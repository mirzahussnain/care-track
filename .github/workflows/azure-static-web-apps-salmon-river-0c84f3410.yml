name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: frontend/caretrack-web/package-lock.json

      - name: Clean previous build output
        run: rm -rf frontend/caretrack-web/dist

      - name: Install dependencies
        working-directory: frontend/caretrack-web
        run: npm ci

      - name: Build Angular app
        working-directory: frontend/caretrack-web
        run: npm run build

      - name: Verify build output
        run: |
          test -f frontend/caretrack-web/dist/caretrack-web/browser/index.html
          test -f frontend/caretrack-web/dist/caretrack-web/browser/staticwebapp.config.json

      - name: Verify referenced assets exist
        shell: bash
        run: |
          cd frontend/caretrack-web/dist/caretrack-web/browser

          echo "Checking files referenced by index.html..."

          assets=$(grep -oE '(src|href)="[^"]+\.(js|css)"' index.html \
            | sed -E 's/.*="([^"]+)"/\1/' \
            | sed 's|^\./||' \
            | sed 's|^/||')

          for file in $assets; do
            if [ ! -f "$file" ]; then
              echo "Missing referenced asset: $file"
              exit 1
            fi

            echo "Found: $file"
          done

          echo "All index.html assets are present."

      - name: Show deployment artifact
        run: |
          echo "Deployment artifact contents:"
          find frontend/caretrack-web/dist/caretrack-web/browser \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

      - name: Verify deployment secret is available
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CARETRACK }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "Static Web Apps deployment token secret is missing."
            exit 1
          fi

          echo "Static Web Apps deployment token secret is present."

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CARETRACK }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend/caretrack-web/dist/caretrack-web/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CARETRACK }}
          action: "close"